name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_ENV: production
  IMAGE_NAME: registry.interno.corp/app-ejemplo
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  quality:
    # runs-on: [self-hosted, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Archive JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: reports/junit/*.xml
          if-no-files-found: ignore

  build:
    needs: quality
    # runs-on: [self-hosted, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Docker image
        run: |
          npm run build
          docker build -t "${IMAGE_NAME}:${BUILD_NUMBER}" .